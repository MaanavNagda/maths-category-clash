<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Category Clash</title>
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<main id="app"></main>
<script src="katex/katex.min.js"></script>
<script src="katex/contrib/auto-render.min.js"></script>
<script src="util.js"></script>
<script src="game.js"></script>
<script type="module">
  const p = new URLSearchParams(location.search);
  const role = p.get("role");
  if (!p.get("room") || !role) {
    const { initLanding } = await import("./sync.js");
    initLanding();
  } else {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = role + ".css";
    document.head.appendChild(link);
    if (role === "host") {
      document.body.insertAdjacentHTML(
        "afterbegin", '<header id="topbar"></header>');
      document.body.insertAdjacentHTML("beforeend",
        '<footer id="hintbar">' +
        "<span>Display link is in setup — share it with the projector</span>" +
        "<span>F11 — Fullscreen</span></footer>");
    }
    await import(`./${role}.js`);
  }
</script>
</body>
</html>
